[project]
name = "cvedetect"
version = "0.1.0"
description = "Detect Windows local-EoP patch-level CVEs over SMB by reading OS build + UBR via RemoteRegistry"
readme = "README.md"
authors = [{ name = "ahos6 (0xNDI)" }]
requires-python = ">=3.11"
dependencies = [
    "impacket>=0.13.0",
    "rich>=13.7.0",
]

[project.scripts]
cvedetect = "cvedetect.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cvedetect*"]
